name: Module 1 Firestore rules tests
on:
  push:
    branches: [test/module1-rules]
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          grep -q "^# fail 0" test-output.txt
      - if: always()
        run: |
          echo "::notice title=Rules test totals::$(grep -E '^# (tests|pass|fail|skipped)' test-output.txt | tr '\n' ' ')"
          grep -E '^ *not ok' test-output.txt | while read -r l; do echo "::error title=Failed test::$l"; done
          grep -E -A12 '^ *not ok' test-output.txt | tr '\n' ' ' | cut -c1-3000 | sed 's/^/::warning title=Failure detail::/'
          grep -E '^ *ok [0-9]+' test-output.txt | tr '\n' ' ' | cut -c1-3500 | sed 's/^/::notice title=Passed tests::/'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: backend-tests/test-output.txt
