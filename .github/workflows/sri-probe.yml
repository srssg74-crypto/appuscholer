name: sri-probe
on:
  push:
    branches: [ci/sri-probe]
jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Integrity hashes of the exact CDN files the app loads
        run: |
          for u in \
            https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js \
            https://unpkg.com/chart.js@4.4.4/dist/chart.umd.js \
            https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js ; do
            for i in 1 2; do
              code=$(curl -sL -o f.js -w "%{http_code}" "$u"); h=$(openssl dgst -sha384 -binary f.js | openssl base64 -A)
              echo "SRI $i $code $(wc -c < f.js) $u sha384-$h"; head -c 120 f.js; echo
            done
          done
          npm pack -s chart.js@4.4.4 && tar xzf chart.js-4.4.4.tgz && ls package/dist | tr '\n' ' ' && echo && echo "NPM sha384-$(openssl dgst -sha384 -binary package/dist/chart.umd.js | openssl base64 -A)"
          for u in https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js; do
            echo "HDR $u"; curl -sI "$u" | grep -i "access-control-allow-origin\|content-type" ; done
